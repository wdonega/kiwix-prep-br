name: imagem

# Monta a imagem do Prep Wiki BR para PC (amd64) e ARM de 64 bits (arm64, Raspberry Pi) e publica em
# ghcr.io/wdonega/prep-wiki-br. Roda quando algo em manager/ muda.
#
# Cada build ganha uma versão no mesmo formato das wikis, AAAA-MM-DD-rN:
#   - a imagem sai no registro com as tags :AAAA-MM-DD-rN e :latest
#   - uma release "imagem-AAAA-MM-DD-rN" traz a mesma imagem em arquivo (.tar.gz, uma por arquitetura),
#     para carregar com "docker load" numa máquina sem acesso ao registro
on:
  push:
    branches: [main]
    paths: ["manager/**", ".github/workflows/imagem.yml"]
  workflow_dispatch:

permissions:
  contents: write   # criar a release
  packages: write   # publicar a imagem

concurrency:
  group: imagem
  cancel-in-progress: false

jobs:
  imagem:
    runs-on: ubuntu-latest
    env:
      IMAGEM: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Definir a versão
        id: v
        run: echo "versao=$(date -u +%Y-%m-%d)-r${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Montar e publicar a imagem
        id: build
        uses: docker/build-push-action@v6
        with:
          context: manager
          # o Go compila para a arquitetura de destino na própria máquina do build: não precisa de emulação
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          build-args: |
            VERSAO=${{ steps.v.outputs.versao }}
            REVISAO=${{ github.sha }}
          tags: |
            ${{ env.IMAGEM }}:${{ steps.v.outputs.versao }}
            ${{ env.IMAGEM }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A mesma imagem, agora em arquivo: uma por arquitetura. O build aproveita o que acabou de ser
      # feito no passo anterior, então só empacota.
      - name: Exportar a imagem em arquivo
        env:
          VERSAO: ${{ steps.v.outputs.versao }}
        run: |
          mkdir saida
          for ARQ in amd64 arm64; do
            ARQUIVO="saida/prep-wiki-br_${VERSAO}_${ARQ}.tar"
            docker buildx build manager --platform "linux/$ARQ" --provenance=false \
              --build-arg "VERSAO=$VERSAO" --build-arg "REVISAO=$GITHUB_SHA" \
              -t "$IMAGEM:$VERSAO" -t "$IMAGEM:latest" \
              --output "type=docker,dest=$ARQUIVO"
            gzip -9 "$ARQUIVO"
            (cd saida && sha256sum "$(basename "$ARQUIVO").gz" > "$(basename "$ARQUIVO").gz.sha256")
          done
          ls -la saida

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSAO: ${{ steps.v.outputs.versao }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          F='```'
          {
            echo "Imagem Docker do **Prep Wiki BR**, para PC (\`amd64\`) e ARM de 64 bits (\`arm64\`, Raspberry Pi 4 e 5)."
            echo
            echo "### Instalar pelo registro"
            echo
            echo "${F}bash"
            echo "docker run -d --name prep-wiki-br --restart unless-stopped \\"
            echo "  -p 8099:8080 -v ~/prep-wiki-br:/data $IMAGEM:$VERSAO"
            echo "$F"
            echo
            echo "A mesma imagem está em \`$IMAGEM:latest\`, que aponta sempre para a versão mais recente."
            echo
            echo "### Instalar a partir do arquivo, sem acesso ao registro"
            echo
            echo "Baixe abaixo o arquivo da sua arquitetura (\`amd64\` para PC, \`arm64\` para Raspberry Pi), leve para a máquina e carregue:"
            echo
            echo "${F}bash"
            echo "docker load -i prep-wiki-br_${VERSAO}_amd64.tar.gz"
            echo "$F"
            echo
            echo "Depois é o mesmo \`docker run\` de cima."
            echo
            echo "Digest no registro: \`$DIGEST\`"
            echo
            echo "Gerada a partir do commit ${GITHUB_SHA::7}: $(git log -1 --pretty=%s)"
          } > notas.md
          gh release create "imagem-$VERSAO" saida/* --title "imagem Docker – $VERSAO" \
            --notes-file notas.md --target "$GITHUB_SHA"
